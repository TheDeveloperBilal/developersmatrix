<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270" role="img" aria-label="How small businesses protect their email domain" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="270" rx="16" fill="#ffffff"/>
<text x="32" y="44" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">How small businesses protect their email domain</text>
<text x="32" y="70" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#6b7280">145 audited domains that receive email</text>
<text x="32" y="120" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#374151">No DMARC record at all</text>
<rect x="362" y="105" width="368" height="22" rx="6" fill="#f3f0ff"/>
<rect x="362" y="105" width="176.6" height="22" rx="6" fill="#7c3aed"/>
<text x="740" y="122" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">48%</text>
<text x="32" y="160" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#374151">DMARC set to monitor only</text>
<rect x="362" y="145" width="368" height="22" rx="6" fill="#f3f0ff"/>
<rect x="362" y="145" width="103.0" height="22" rx="6" fill="#7c3aed"/>
<text x="740" y="162" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">28%</text>
<text x="32" y="200" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#374151">DMARC blocks or quarantines fakes</text>
<rect x="362" y="185" width="368" height="22" rx="6" fill="#f3f0ff"/>
<rect x="362" y="185" width="84.6" height="22" rx="6" fill="#7c3aed"/>
<text x="740" y="202" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">23%</text>
<text x="32" y="250" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#9ca3af">Source: DevelopersMatrix audit of US small business websites, October 2026</text>
</svg>